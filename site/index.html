<style>
@font-face { font-family: "Cormorant"; src: url(assets/CormorantGaramond.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
:root {
  --bg: #15122A; --bg2: #1F1B36; --card: #262142; --line: #4A4370;
  --text: #F3E9D2; --muted: #B9B0D6; --violet: #D3C8F5; --gold: #E6C77F; --gold2: #C9A44C;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html.lenis { scroll-behavior: auto; height: auto; } /* Lenis animates the scroll itself */
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent), radial-gradient(1px 1px at 72% 9%, #fff6 50%, transparent),
  radial-gradient(1.5px 1.5px at 38% 42%, #fff5 50%, transparent), radial-gradient(1px 1px at 88% 36%, #fff7 50%, transparent),
  radial-gradient(1px 1px at 22% 78%, #fff5 50%, transparent), radial-gradient(1.5px 1.5px at 64% 70%, #fff4 50%, transparent),
  radial-gradient(900px 600px at 80% -10%, #4B3F7299, transparent), radial-gradient(700px 500px at -10% 60%, #332D5566, transparent); }
a { color: var(--gold); }
h1, h2, h3 { font-family: "Cormorant", Georgia, serif; font-weight: 600; line-height: 1.15; margin: 0 0 .4em; }
h1 { font-size: clamp(2.6rem, 6vw, 4.2rem); }
h2 { font-size: clamp(2rem, 4.5vw, 2.9rem); text-align: center; }
h3 { font-size: 1.5rem; color: var(--gold); }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
section { padding: 72px 0; }
.lead { color: var(--muted); font-size: 1.15rem; max-width: 640px; }
.center { text-align: center; margin-left: auto; margin-right: auto; }

header { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: #15122Acc; border-bottom: 1px solid #ffffff12; }
header .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: "Cormorant", serif; font-size: 1.6rem; font-weight: 700; color: var(--text); text-decoration: none; margin-right: auto; }
.brand img { width: 36px; height: 36px; border-radius: 9px; }
nav a { color: var(--muted); text-decoration: none; margin-left: 18px; font-size: .95rem; }
nav a:hover { color: var(--text); }
select { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font: inherit; font-size: .9rem; }
@media (max-width: 720px) { nav { display: none; } }

.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center; padding-top: 56px; }
.kicker { color: var(--gold); letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; font-weight: 600; }
.stores { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0 10px; }
/* Official store badges, unmodified. Google's file has its own clear space, so it is drawn taller and pulled in. */
.badge { display: block; height: 44px; width: auto; }
.badge.g { height: 57px; margin: -6px -3px; }
.stores { align-items: center; }
.note.soon { margin: 28px 0 -18px; }
.note { color: var(--muted); font-size: .9rem; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; text-align: center; } .hero .lead { margin: 0 auto; } .stores { justify-content: center; } }

.phone { width: 310px; max-width: 100%; margin: 0 auto; padding: 12px; border-radius: 46px; background: #0c0a19; border: 1px solid #ffffff22; box-shadow: 0 30px 80px #0009, 0 0 0 6px #ffffff08; }
.screen { position: relative; overflow: hidden; height: 640px; border-radius: 36px; background: #F6F0E3; color: #2B2140; padding: 0 14px; font-size: 13px; line-height: 1.4; text-align: center; }
.status { display: flex; justify-content: space-between; align-items: center; height: 40px; padding: 4px 10px 0; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.status .island { width: 78px; height: 22px; border-radius: 12px; background: #0c0a19; margin-top: -2px; }
.status svg { height: 11px; fill: #2B2140; }
.screen .bar { display: flex; justify-content: space-between; align-items: center; height: 34px; color: #2B2140; }
.screen .bar b { font-family: "Cormorant", serif; font-size: 22px; font-weight: 600; }
.screen .bar svg, .tbtn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.screen .bar span { display: flex; gap: 12px; min-width: 50px; }
.screen .bar span:last-child { justify-content: flex-end; }
.screen .greet { font-family: "Cormorant", serif; font-size: 23px; margin-top: 8px; line-height: 1.2; }
.screen .date { font-size: 11.5px; margin-bottom: 6px; }
.msg { border-radius: 20px; padding: 14px 14px 16px; margin-bottom: 8px; border: 1px solid #C9A44C; background: linear-gradient(135deg, #5A4D8A, #2E2652); box-shadow: 0 8px 18px #2B214033; }
.msg .star { color: #F1D98A; font-size: 13px; }
.msg .lead { font-family: "Cormorant", serif; font-size: 21px; line-height: 1.2; color: #fff; margin: 4px auto 0; max-width: none; }
.msg .rule { width: 44px; height: 1px; background: #F1D98A66; margin: 10px auto; }
.msg .support { font-family: "Cormorant", serif; font-size: 15px; font-weight: 600; color: #F1D98A; line-height: 1.25; }
.tarot-frame { position: relative; border-radius: 22px; margin-top: 8px; background: linear-gradient(#FFFBF3, #F1E8D2); padding: 18px 14px 14px; border: 1.5px solid #C9A44C; outline: 1px solid #C9A44C88; outline-offset: -5px; text-align: left; }
.ritual { display: flex; gap: 12px; align-items: flex-start; }
.cback { flex: none; width: 54px; height: 86px; border-radius: 6px; border: 1.5px solid #C9A44C; outline: 1px solid #C9A44C88; outline-offset: -4px; background: linear-gradient(135deg, #5A4D8A, #2E2652); display: grid; place-items: center; box-shadow: 0 4px 8px #2B214044; }
.cback svg { width: 26px; height: 26px; fill: #F1D98A; }
.ritual .rt { font-family: "Cormorant", serif; font-size: 22px; line-height: 1.1; margin-bottom: 3px; }
.ritual .rbtn { display: inline-block; margin-top: 6px; padding: 7px 14px; border-radius: 999px; background: #4B3F72; color: #FFF8EC; font-weight: 600; font-size: 12px; }
.mq { font-family: "Cormorant", serif; font-size: 17px; text-align: center; margin: 12px 0 2px; }
.faces { display: flex; justify-content: space-around; }
.faces svg { width: 27px; height: 27px; fill: none; stroke: #5F5675; stroke-width: 1.6; stroke-linecap: round; }
.tbtn { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; padding: 11px; border-radius: 999px; background: #E6DEF7; color: #3D3358; font-weight: 600; font-size: 13px; }
.nav { position: absolute; left: 10px; right: 10px; bottom: 12px; height: 62px; padding: 5px 6px; border-radius: 31px; display: flex; align-items: center; background: #ffffffa8; backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6); border: 1px solid #ffffffcc; box-shadow: 0 6px 18px #2B214030; }
.nav div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9.5px; font-weight: 500; color: #4D4170; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.nav .mid { color: #2B2140; font-weight: 700; background: #E8E0CD; border-radius: 26px; padding: 5px 2px 3px; }
.nav .mid span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: #C9A44C; }
.nav .mid svg { width: 17px; height: 17px; stroke: #2B2140; fill: #2B2140; stroke-width: 1; }

.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sky .layer { position: absolute; left: 0; top: 0; width: 100%; will-change: transform; }
.sky .layer svg { display: block; width: 100%; height: 100%; }
.sky .tw { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
.sky .milky { position: absolute; left: 50%; top: 50%; width: 190vmax; height: 60vmax; margin: -30vmax 0 0 -95vmax; will-change: transform;
  background: radial-gradient(ellipse 38% 6% at 50% 52%, #0B091855, transparent 75%), radial-gradient(ellipse 34% 10% at 42% 46%, #F3E9D226, transparent 70%),
    radial-gradient(ellipse 24% 9% at 66% 56%, #8FB4FF22, transparent 70%), radial-gradient(ellipse 50% 24% at 50% 50%, #B9A8FF2b, transparent 70%); }
.sky .sigil { position: absolute; left: -1vw; top: 64px; height: min(46vh, 94vw, 460px); aspect-ratio: 2 / 3; opacity: .5; will-change: transform; overflow: visible; }
.sky .sigil .z { opacity: 0; transition: opacity .9s ease; }
.sky .sigil .z.on { opacity: 1; }
@media (max-width: 700px) { .sky .sigil { opacity: .32; } }
@media (prefers-reduced-motion: reduce) { .sky .sigil .z { transition: none; } }
.sky .milky svg { display: block; width: 100%; height: 100%; }
.sky .moon { position: absolute; right: 2vw; top: 58vh; width: clamp(84px, 13vw, 160px); height: clamp(84px, 13vw, 160px); filter: drop-shadow(0 0 28px #F1E6C85a); will-change: transform; }
@media (prefers-reduced-motion: reduce) { .sky .tw { animation: none; } }
/* Home-screen widgets drawn as the app's own (ios/DayWidget/DayWidget.swift); sizes in em so the phone can show them smaller. */
.wgrid { display: grid; grid-template-columns: repeat(2, 9.875em); gap: 1.375em; justify-content: center; font-size: min(16px, 4.2vw); }
.wg { height: 9.875em; border-radius: 1.4em; padding: 1em; background: linear-gradient(135deg, #5A4D8A, #2E2652); color: #fff; text-align: left; display: flex; flex-direction: column; gap: .25em; overflow: hidden; box-shadow: 0 .6em 1.6em #0007; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.25; }
.wg.m, .wg.l { grid-column: span 2; }
.wg.l { height: 22.125em; gap: .44em; }
.wg > * { flex: none; min-width: 0; }
.wg b { font-weight: 600; }
.wg .c2 { font-size: .6875em; } .wg .cap { font-size: .75em; } .wg .fn { font-size: .8125em; } .wg .sub { font-size: .9375em; } .wg .hd { font-size: 1.0625em; }
.wg .t3 { font: 600 1.3em/1.2 "Cormorant", Georgia, serif; } .wg .t2 { font: 600 1.5em/1.15 "Cormorant", Georgia, serif; }
.wg .gold { color: #F1D98A; } .wg .par { color: #F2E8D1; }
.wg .lab { font-size: .6875em; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #F1D98A; }
.wg .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wg .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: var(--n, 2); overflow: hidden; }
.wg .grow { flex: 1 1 0; }
.wg .row { display: flex; justify-content: space-between; align-items: center; gap: .4em; }
.wg .cols { display: flex; gap: .6em; margin-top: .15em; } .wg .cols > * { flex: 1; display: flex; flex-direction: column; gap: .2em; }
.wg .dots { display: inline-flex; gap: .2em; flex: none; } .wg .dots i { width: .44em; height: .44em; border-radius: 50%; background: #ffffff38; } .wg .dots i.on { background: #F1D98A; }
.wg .dots.big { gap: .34em; } .wg .dots.big i { width: .75em; height: .75em; }
.wg .mn { width: 2.1em; height: 2.1em; flex: none; } .wg .mn.sm { width: 1.5em; height: 1.5em; }
.wg .th { flex: none; width: var(--w, 2.5em); aspect-ratio: .58; border-radius: .3em; object-fit: cover; }
.wg hr { border: 0; border-top: 1px solid #F1D98A66; margin: 0; align-self: stretch; }
.wg .mid { display: flex; align-items: center; gap: .75em; } .wg .mid > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: .15em; }
.wg.ctr { align-items: center; text-align: center; } .wg.ctr .mid { align-self: stretch; text-align: left; }
.wg .rule { width: 2.75em; height: 1px; background: #F1D98A66; margin: .15em 0; }
.wsplit { margin-top: 36px; align-items: center; }
.screen.home { background: linear-gradient(165deg, #3B2F63, #17132B 55%, #40305C); color: #fff; padding: 0 12px; }
.home .status svg { fill: #fff; } .home .status svg [stroke] { stroke: #fff; }
.home .wgrid { font-size: 12.3px; margin-top: 6px; }
.dock { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 68px; border-radius: 26px; background: #ffffff24; display: flex; justify-content: space-around; align-items: center; padding: 0 8px; }
.dock > * { width: 44px; height: 44px; border-radius: 11px; background: #ffffff2e; }
.cards3 { position: relative; height: 0; }
.float { position: absolute; width: 110px; height: auto; border-radius: 8px; border: 2px solid var(--gold2); box-shadow: 0 16px 40px #000a; }
@media (max-width: 1100px) { .float { display: none; } }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 36px; }
.tile { background: linear-gradient(160deg, var(--card), var(--bg2)); border: 1px solid #ffffff14; border-radius: 22px; padding: 24px; }
.tile .ico { margin-bottom: 12px; color: var(--gold); }
.tile .ico svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
.tile p { color: var(--muted); margin: 0; font-size: .97rem; }

.band { background: linear-gradient(180deg, transparent, #1F1B36aa, transparent); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
.split h2 { text-align: left; }
ul.check { list-style: none; padding: 0; margin: 18px 0 0; }
ul.check li { padding-left: 34px; position: relative; margin: 12px 0; }
ul.check li::before { content: "✦"; position: absolute; left: 4px; color: var(--gold); }
.tarot { display: flex; justify-content: center; align-items: center; gap: 14px; }
.tarot img { width: 30%; max-width: 150px; height: auto; border-radius: 10px; border: 2px solid var(--gold2); box-shadow: 0 14px 36px #0008; }
.tarot img:nth-child(2) { transform: translateY(-18px); }

.langs { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
.langs button { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 8px 18px; font: inherit; cursor: pointer; }
.langs button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

.honest { max-width: 760px; margin: 0 auto; text-align: center; border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; background: #1F1B3699; }
.honest p { color: var(--muted); margin: 0; }

.cta { text-align: center; }
.cta .stores { justify-content: center; }
footer { border-top: 1px solid #ffffff12; padding: 32px 0 48px; color: var(--muted); font-size: .85rem; }
footer p { margin: 6px 0; }
</style>
</head>
<body>
<!-- Sky behind the page: stars drift at different speeds as you scroll, the Milky Way drifts
     slowly and the Moon changes phase from new to full over the length of the page. -->
<div class="sky" aria-hidden="true">
  <div class="milky" id="milky"></div>
  <div class="layer" id="stars1"></div><div class="layer" id="stars2"></div><div class="layer" id="stars3"></div>
  <!-- Two tarot card outlines; the front one shows a zodiac sign and its number, changing with time and scroll. -->
  <svg class="sigil" id="sigil" viewBox="0 0 200 300" fill="none" stroke="#E6C77F" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-15 100 150)" stroke-opacity=".55"><rect x="38" y="48" width="128" height="204" rx="11"/><rect x="45" y="55" width="114" height="190" rx="7" stroke-width=".5"/></g>
    <g id="sigilCard"><rect x="38" y="48" width="128" height="204" rx="11" fill="#17132Bcc"/><rect x="45" y="55" width="114" height="190" rx="7" stroke-width=".5"/>
      <path d="M82 226H118M96 232H104" stroke-width=".6"/><g id="sigilSigns"></g></g>
  </svg>
  <svg class="moon" id="moon" viewBox="-100 -100 200 200">
    <defs>
      <mask id="phase"><rect x="-100" y="-100" width="200" height="200" fill="#fff"/><circle id="shadow" cx="120" cy="0" r="92" fill="#000"/></mask>
      <radialGradient id="mg" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#FFF8E0"/><stop offset="1" stop-color="#D6C493"/></radialGradient>
    </defs>
    <circle r="90" fill="none" stroke="#F1E6C8" stroke-opacity=".18"/>
    <g id="moonRot"><g mask="url(#phase)"><circle r="90" fill="url(#mg)"/>
      <circle cx="-30" cy="-25" r="16" fill="#8A7A52" fill-opacity=".16"/><circle cx="28" cy="18" r="22" fill="#8A7A52" fill-opacity=".13"/>
      <circle cx="-8" cy="40" r="10" fill="#8A7A52" fill-opacity=".16"/><circle cx="42" cy="-40" r="9" fill="#8A7A52" fill-opacity=".14"/></g></g>
  </svg>
</div>
<header>
  <div class="wrap">
    <a class="brand" href="#top"><img src="assets/icon-192.webp" alt="" width="36" height="36">Digi Witch</a>
    <nav>
      <a href="#features" data-t="navFeatures"></a>
      <a href="#privacy" data-t="navPrivacy"></a>
      <a href="#download" data-t="navDownload"></a>
    </nav>
    <select id="lang" aria-label="Language">
      <option value="pl">Polski</option><option value="en">English</option><option value="de">Deutsch</option>
      <option value="fr">Français</option><option value="es">Español</option><option value="uk">Українська</option><option value="it">Italiano</option><option value="pt">Português</option><option value="nl">Nederlands</option>
    </select>
  </div>
</header>

<main id="top">
  <div class="wrap cards3" aria-hidden="true">
    <img class="float" src="assets/major_17.webp" alt="" width="240" height="407" loading="lazy" style="left:-130px;top:470px;transform:rotate(-9deg)">
  </div>
  <section class="wrap hero">
    <div>
      <div class="kicker" data-t="kicker"></div>
      <h1 data-t="heroTitle"></h1>
      <p class="lead" data-t="heroSub"></p>
      <p class="note soon" data-t="soon"></p>
      <div class="stores">
        <!-- TODO: wrap the badges in store links after the apps are published -->
        <img class="badge" data-b="apple" alt="App Store" width="132" height="44">
        <img class="badge g" data-b="google" alt="Google Play" width="147" height="57">
      </div>
      <p class="note" data-t="heroNote"></p>
    </div>
    <!-- The app's Today screen (light theme), texts taken from the app itself (const M). -->
    <div class="phone" aria-hidden="true">
      <div class="screen">
        <div class="status"><span>9:41</span><i class="island"></i><svg viewBox="0 0 46 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="8" rx="1"/><rect x="15" y="0" width="3" height="11" rx="1"/><rect x="24" y="0.5" width="20" height="10" rx="3" fill="none" stroke="#2B2140" stroke-width="1"/><rect x="26" y="2.5" width="14" height="6" rx="1.5"/></svg></div>
        <div class="bar"><span id="mL"></span><b>Digi Witch</b><span id="mR"></span></div>
        <div class="greet" id="mGreet"></div>
        <div class="date" id="mDate"></div>
        <div class="msg">
          <div class="star">✦</div>
          <div class="lead" id="mLead"></div>
          <div class="rule"></div>
          <div class="support" id="mSupport"></div>
        </div>
        <div class="tarot-frame">
          <div class="ritual">
            <div class="cback"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></div>
            <div>
              <div class="rt" id="mCard"></div>
              <div id="mHint"></div>
              <div class="rbtn" id="mReveal"></div>
            </div>
          </div>
          <div class="mq" id="mMood"></div>
          <div class="faces" id="mFaces"></div>
          <div class="tbtn"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="11" height="16" rx="2"/><path d="M19 7l2 1-3 11"/></svg><span id="mTarot"></span></div>
        </div>
        <div class="nav" id="mNav"></div>
      </div>

  <section id="features">
    <div class="wrap">
      <h2 data-t="featTitle"></h2>
      <p class="lead center" style="text-align:center" data-t="featSub"></p>
      <div class="grid" id="tiles"></div>
    </div>
  </section>

  <section class="band">
    <div class="wrap split">
      <div class="tarot" aria-hidden="true">
        <img src="assets/major_18.webp" alt="" width="240" height="426" loading="lazy"><img src="assets/major_17.webp" alt="" width="240" height="407" loading="lazy"><img src="assets/major_19.webp" alt="" width="240" height="414" loading="lazy">
      </div>

function initial() {
  const q = new URLSearchParams(location.search).get('lang');
  if (T[q]) return q;
  try { const s = localStorage.getItem('lang'); if (T[s]) return s; } catch (_) {}
  for (const l of navigator.languages || [navigator.language]) { const k = (l || '').slice(0, 2).toLowerCase(); if (T[k]) return k; }
  return 'en';
}

  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const layers = [
    { el: document.getElementById('stars1'), rate: 0.05, n: 70, r: [0.5, 1.0], color: '#fff', op: 0.55, spark: 0 },
    { el: document.getElementById('stars2'), rate: 0.12, n: 34, r: [0.9, 1.5], color: '#F3E9D2', op: 0.8, spark: 0 },
    { el: document.getElementById('stars3'), rate: 0.22, n: 12, r: [3, 5], color: '#E6C77F', op: 0.95, spark: 1 }];
  const milky = document.getElementById('milky'), moon = document.getElementById('moon');
  const shadow = document.getElementById('shadow'), moonRot = document.getElementById('moonRot');
  // The twelve signs, Aries first, drawn as small strokes in a 20 x 20 box.
  const SIGNS = [
    'M0 9V-2M0-2C0-9-9-9-9-3M0-2C0-9 9-9 9-3',                                   // Aries
    'M-8-8C-8 0 8 0 8-8M-5 4a5 5 0 1 0 10 0a5 5 0 1 0-10 0',                      // Taurus
    'M-6-8V8M6-8V8M-9-7C-4-5 4-5 9-7M-9 7C-4 5 4 5 9 7',                           // Gemini
    'M-7-1C-7-9 6-9 9-5M7 1C7 9-6 9-9 5M-8-4a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0M4 4a2.2 2.2 0 1 0 4.4 0a2.2 2.2 0 1 0-4.4 0', // Cancer
    'M-5 3a3 3 0 1 0 6 0a3 3 0 1 0-6 0M-2 0C-2-8 6-10 7-3C7 3 5 8 9 8',            // Leo
    'M-9-6V6M-9-4C-9-8-3-8-3-4V6M-3-4C-3-8 3-8 3-4V4C3 8 7 9 9 5C9 3 6 2 3 4',     // Virgo
    'M-9 7H9M-9 2H-4C-8 2-7-6 0-6C7-6 8 2 4 2H9',                                   // Libra
    'M-9-7V4M-9-3C-9-8-3-8-3-3V4M-3-3C-3-8 3-8 3-3V6C3 9 6 9 9 6M6 3L9 6L5 7',      // Scorpio
    'M-8 8L8-8M2-8H8V-2M-5 1L1 7',                                                  // Sagittarius
    'M-9-6L-5 4M-5 4C-5-4-3-8 0-8C3-8 3-2 1 1C-1 4 3 8 6 6C9 4 7 0 4 1',            // Capricorn
    'M-9-3L-6-6L-3-3L0-6L3-3L6-6L9-3M-9 4L-6 1L-3 4L0 1L3 4L6 1L9 4',               // Aquarius
    'M-6-9C-1-5-1 5-6 9M6-9C1-5 1 5 6 9M-8 0H8'];                                   // Pisces
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
  const sigil = document.getElementById('sigil'), sigilCard = document.getElementById('sigilCard');
  document.getElementById('sigilSigns').innerHTML = SIGNS.map((d, k) => `<g class="z${k ? '' : ' on'}"><path d="${d}" transform="translate(102 152) scale(3.4)" stroke-width=".5"/>` +
    `<text x="102" y="86" text-anchor="middle" font-family="Cormorant, 'Cormorant Garamond', serif" font-size="19" fill="#E6C77F" stroke="none">${ROMAN[k]}</text></g>`).join('');
  const zs = sigil.querySelectorAll('.z'); let tick = 0, shown = 0;
  // Milky Way: a few hundred faint stars crowded towards the middle of a tilted band.
  const dust = ['', '', '', ''];
  for (let i = 0; i < 520; i++) {
    const g = (rnd() + rnd() + rnd() - 1.5) / 1.5;
    dust[i % 4] += `M${(rnd() * 1900).toFixed(0)} ${(300 + g * 240).toFixed(0)}h0`;
  }
  // One path per size: 520 separate circles made the page too heavy.
  milky.innerHTML = `<svg viewBox="0 0 1900 600" preserveAspectRatio="none" fill="none" stroke="#F3E9D2" stroke-linecap="round">` +
    dust.map((d, k) => `<path d="${d}" stroke-width="${1.2 + k * .6}" opacity="${.3 + k * .15}"/>`).join('') + '</svg>';
  let max = 1, doc = 0; // page height comes from the ResizeObserver below, so nothing here forces a layout
  function build() {
    const H = innerHeight, W = innerWidth;

      for (let i = 0; i < L.n * Math.max(1, h / H / 1.4); i++) {
        const x = rnd() * W, y = rnd() * h, r = L.r[0] + rnd() * (L.r[1] - L.r[0]), d = (rnd() * 4).toFixed(2);
        out += L.spark
          ? `<path class="tw" style="animation-delay:-${d}s" fill="${L.color}" opacity="${L.op}" d="M${x.toFixed(0)} ${(y - r * 2).toFixed(0)}L${(x + r * .35).toFixed(1)} ${(y - r * .35).toFixed(1)} ${(x + r * 2).toFixed(0)} ${y.toFixed(0)} ${(x + r * .35).toFixed(1)} ${(y + r * .35).toFixed(1)} ${x.toFixed(0)} ${(y + r * 2).toFixed(0)} ${(x - r * .35).toFixed(1)} ${(y + r * .35).toFixed(1)} ${(x - r * 2).toFixed(0)} ${y.toFixed(0)} ${(x - r * .35).toFixed(1)} ${(y - r * .35).toFixed(1)}Z"/>`
          : `<circle class="${rnd() < .4 ? 'tw' : ''}" style="animation-delay:-${d}s" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(2)}" fill="${L.color}" opacity="${L.op}"/>`;
      }
      L.el.style.height = h + 'px';
      L.el.innerHTML = `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none">${out}</svg>`;
    }
  }
  let queued = false;
  function frame() {
    queued = false;
    const y = scrollY, p = Math.min(1, y / max);
    for (const L of layers) L.el.style.transform = `translate3d(0,${(-y * L.rate).toFixed(1)}px,0)`;
    milky.style.transform = `translate3d(0,${(-y * 0.04).toFixed(1)}px,0) rotate(-32deg)`;
    shadow.setAttribute('cx', (120 - 330 * p).toFixed(1));
    moonRot.setAttribute('transform', `rotate(${(20 + y * 0.03).toFixed(1)})`);
    const k = (Math.floor(y / 320) + tick) % 12;
    if (k !== shown) { if (shown >= 0) zs[shown].classList.remove('on'); zs[k].classList.add('on'); shown = k; }
    sigil.style.transform = `translate3d(0,${(-y * 0.06).toFixed(1)}px,0)`;
    sigilCard.setAttribute('transform', `rotate(${(4 + 5 * Math.sin(y / 420)).toFixed(2)} 102 150)`);
    moon.style.transform = `translate3d(0,${(y * 0.04).toFixed(1)}px,0)`;
  }
  // Fires once at start and whenever the page changes size (window resize, language change).
  new ResizeObserver(e => { doc = e[0].contentRect.height; frame(); build(); }).observe(document.documentElement);
  if (still) return;

  let timer; const go = () => timer ||= setInterval(() => { tick++; frame(); }, 4000);
  for (const e of ['scroll', 'pointermove', 'touchstart', 'keydown']) addEventListener(e, go, { once: true, passive: true });
  addEventListener('scroll', () => { if (!queued) { queued = true; requestAnimationFrame(frame); } }, { passive: true });
})();
</script>
